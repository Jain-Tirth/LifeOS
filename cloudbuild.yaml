steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/lifeos-backend:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/lifeos-backend:$SHORT_SHA'
      - '.'

  # Step 2: Push Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'push'
      - 'gcr.io/$PROJECT_ID/lifeos-backend:latest'

  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'push'
      - 'gcr.io/$PROJECT_ID/lifeos-backend:$SHORT_SHA'

  # Step 3: Run database migrations
  - name: 'gcr.io/cloud-builders/gke-deploy'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1'
      - 'CLOUDSDK_CONTAINER_CLUSTER=lifeos-cluster'
    args:
      - 'run'
      - '--filename=k8s/'
      - '--location=us-central1'
      - '--cluster=lifeos-cluster'

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/run'
    args:
      - 'deploy'
      - 'lifeos-backend'
      - '--image=gcr.io/$PROJECT_ID/lifeos-backend:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=^:^DB_ENGINE=postgres:DB_NAME=${_DB_NAME}:DB_USER=${_DB_USER}:INSTANCE_CONNECTION_NAME=${_INSTANCE_CONNECTION_NAME}:DJANGO_SECRET_KEY=${_DJANGO_SECRET_KEY}:DEBUG=False:ALLOWED_HOSTS=${_ALLOWED_HOSTS}:GROQ_API_KEY=${_GROQ_API_KEY}'
      - '--service-account=lifeos-cloud-run@$PROJECT_ID.iam.gserviceaccount.com'
      - '--vpc-connector=projects/$PROJECT_ID/locations/us-central1/connectors/lifeos-vpc'
      - '--timeout=3600'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--max-instances=100'

images:
  - 'gcr.io/$PROJECT_ID/lifeos-backend:latest'
  - 'gcr.io/$PROJECT_ID/lifeos-backend:$SHORT_SHA'

substitutions:
  _DB_NAME: 'lifeos'
  _DB_USER: 'lifeos_app'
  _INSTANCE_CONNECTION_NAME: 'your-project:us-central1:lifeos-db'
  _DJANGO_SECRET_KEY: ''
  _ALLOWED_HOSTS: 'lifeos-backend.run.app'
  _GROQ_API_KEY: ''

options:
  machineType: 'N1_HIGHCPU_8'

timeout: '1800s'
